<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="cursor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Container squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="url(#border)" stroke-width="2.5" />

  <!-- Terminal chevron '>' -->
  <path d="M18 19L32 32L18 45" stroke="url(#accent)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Terminal cursor '_' -->
  <path d="M37 45H49" stroke="url(#cursor)" stroke-width="5.5" stroke-linecap="round" />
</svg>
